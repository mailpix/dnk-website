<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DNK Admin Login</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="assets/css/admin.css">
</head>

<body>

    <div class="login-container">
        <div class="login-box">
            <div class="logo-area">
                <img src="assets/images/logo.png" alt="DNK Logo" class="admin-logo">
                <h2>Admin Portal</h2>
            </div>

            <form id="login-form">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" required placeholder="Punya email admin?">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <div class="password-container">
                        <input type="password" id="password" required placeholder="Punya password admin?">
                        <i id="toggle-password" class="eye-icon">&#128065;</i> <!-- Ikon Mata -->
                    </div>
                </div>

                <div id="login-error" class="error-msg"></div>

                <button type="submit" class="btn-login" id="btn-login">
                    <span id="btn-text">Masuk Dashboard</span>
                    <span id="btn-loading" style="display:none;">Loading...</span>
                </button>
            </form>
        </div>
    </div>

    <!-- Appwrite SDK -->
    <script src="https://cdn.jsdelivr.net/npm/appwrite@14.0.1"></script>

    <!-- App Logic -->
    <script src="assets/js/appwrite-config.js"></script>
    <script src="assets/js/auth.js"></script>
</body>

</html>
